<!-- Mikhak font (OFL 1.1, aminabedi68/Mikhak) for Persian and English text -->
<style>
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-Light.ttf') format('truetype'); font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Mikhak'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Mikhak@3.4/fonts/ttf/Mikhak-ExtraBold.ttf') format('truetype'); font-weight: 800; font-display: swap; }

  :root {
    --doc-text: #1e293b;
    --doc-muted: #64748b;
    --doc-h1: #0f172a;
    --doc-h2: #2563eb;
    --doc-h3: #334155;
    --doc-border: #e2e8f0;
    --doc-code-bg: #f1f5f9;
    --doc-code-text: #0f172a;
    --doc-callout-bg: #eff6ff;
    --doc-callout-border: #3b82f6;
    --doc-callout-text: #1e293b;
    --doc-link: #2563eb;
    --doc-th-bg: #f1f5f9;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --doc-text: #e2e8f0;
      --doc-muted: #94a3b8;
      --doc-h1: #f8fafc;
      --doc-h2: #60a5fa;
      --doc-h3: #cbd5e1;
      --doc-border: #334155;
      --doc-code-bg: #1e293b;
      --doc-code-text: #38bdf8;
      --doc-callout-bg: #0f172a;
      --doc-callout-border: #3b82f6;
      --doc-callout-text: #f1f5f9;
      --doc-link: #60a5fa;
      --doc-th-bg: #1e293b;
    }
  }

  body, .vscode-dark, .vscode-light {
    font-family: 'Mikhak', sans-serif !important;
  }

  .document-body {
    direction: rtl;
    text-align: right;
    font-family: 'Mikhak', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.9;
    color: var(--doc-text);
    max-width: 850px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* Force RTL on every text element (renderers may auto-detect direction from the first Latin word) */
  .document-body div,
  .document-body p,
  .document-body li,
  .document-body h1,
  .document-body h2,
  .document-body h3,
  .document-body h4,
  .document-body h5,
  .document-body h6,
  .document-body blockquote,
  .document-body table,
  .document-body th,
  .document-body td,
  .document-body details,
  .document-body summary,
  .document-body figcaption {
    direction: rtl;
    unicode-bidi: isolate;
  }

  /* Headings */
  .document-body h1 {
    font-weight: 800;
    color: var(--doc-h1);
    border-bottom: 2px solid var(--doc-border);
    padding-bottom: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .document-body h2 {
    font-weight: 700;
    color: var(--doc-h2);
    margin-top: 2.2rem;
    border-right: 4px solid var(--doc-h2);
    padding-right: 0.75rem;
  }

  .document-body h3 {
    font-weight: 600;
    color: var(--doc-h3);
    margin-top: 1.25rem;
  }

  .document-body h4 {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--doc-h3);
    margin-top: 1.1rem;
  }

  .document-body h5 {
    font-weight: 600;
    font-size: 0.97em;
    color: var(--doc-muted);
    margin-top: 1rem;
  }

  .document-body h6 {
    font-weight: 500;
    font-size: 0.9em;
    color: var(--doc-muted);
    margin-top: 1rem;
  }

  /* Text */
  .document-body p, .document-body li {
    color: var(--doc-text);
    text-align: justify;
  }

  .document-body ul, .document-body ol {
    padding-right: 1.5rem;
    padding-left: 0;
  }

  .document-body a {
    color: var(--doc-link);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .document-body hr {
    border: none;
    border-top: 1px solid var(--doc-border);
    margin: 2rem 0;
  }

  .document-body img {
    display: block;
    max-width: 100%;
    margin: 1.25rem auto;
    border-radius: 8px;
  }

  .document-body figcaption {
    text-align: center;
    color: var(--doc-muted);
    font-size: 0.9em;
  }

  .document-body mark {
    background-color: #fde68a;
    color: #1e293b;
    padding: 0 0.25rem;
    border-radius: 3px;
  }

  .document-body summary {
    cursor: pointer;
    font-weight: 600;
  }

  /* Quote */
  .document-body blockquote {
    margin: 1.25rem 0;
    padding: 0.5rem 1.1rem;
    border-right: 4px solid var(--doc-muted);
    background-color: var(--doc-code-bg);
    color: var(--doc-muted);
    border-radius: 6px;
  }

  .document-body blockquote p {
    color: var(--doc-muted);
    margin: 0.4rem 0;
  }

  /* Tables */
  .document-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    font-size: 0.95em;
  }

  .document-body th, .document-body td {
    border: 1px solid var(--doc-border);
    padding: 0.55rem 0.8rem;
    text-align: right;
  }

  .document-body th {
    background-color: var(--doc-th-bg);
    color: var(--doc-h1);
    font-weight: 700;
  }

  /* Code: always LTR + monospace */
  .document-body code,
  .document-body kbd {
    font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace;
    direction: ltr;
    display: inline-block;
    background-color: var(--doc-code-bg);
    color: var(--doc-code-text);
    padding: 0.15rem 0.45rem;
    border-radius: 5px;
    font-size: 0.88em;
    border: 1px solid var(--doc-border);
  }

  .document-body pre {
    direction: ltr;
    text-align: left;
    unicode-bidi: isolate;
    font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace;
    background-color: var(--doc-code-bg);
    color: var(--doc-code-text);
    border: 1px solid var(--doc-border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin: 1.25rem 0;
    overflow-x: auto;
    line-height: 1.6;
    font-size: 0.9em;
    white-space: pre;
  }

  .document-body pre code {
    display: block;
    direction: ltr;
    text-align: left;
    font-family: inherit;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
    white-space: pre;
  }

  /* English block: wrap in <div class="ltr"> to render fully LTR, left-aligned */
  .document-body .ltr,
  .document-body .ltr * {
    direction: ltr;
    text-align: left;
  }

  .document-body .ltr ul,
  .document-body .ltr ol {
    padding-left: 1.5rem;
    padding-right: 0;
  }

  .document-body .ltr h2 {
    border-right: none;
    padding-right: 0;
    border-left: 4px solid var(--doc-h2);
    padding-left: 0.75rem;
  }

  .document-body .ltr blockquote {
    border-right: none;
    border-left: 4px solid var(--doc-muted);
  }

  /* Callout */
  .document-body .callout-poc {
    background-color: var(--doc-callout-bg);
    border: 1px solid var(--doc-callout-border);
    border-right: 5px solid var(--doc-callout-border);
    border-radius: 8px;
    padding: 1.2rem;
    margin: 1.5rem 0;
    color: var(--doc-callout-text);
  }

  /* Numbered step list */
  .document-body .step-list {
    counter-reset: step-counter;
    list-style: none;
    padding-right: 0;
  }

  .document-body .step-list li {
    position: relative;
    padding-right: 2.5rem;
    margin-bottom: 0.85rem;
  }

  .document-body .step-list li::before {
    counter-increment: step-counter;
    content: counter(step-counter);
    position: absolute;
    right: 0;
    top: 3px;
    background-color: #2563eb;
    color: #ffffff;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
  }
</style>

<div class="document-body">
